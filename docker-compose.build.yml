# Builds every image from this checkout instead of pulling releases:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
services:
  core:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
  beets-worker:
    build: beets-worker
  retriever-ytdlp:
    build: plugins/retriever-ytdlp
  retriever-inbox:
    build: plugins/retriever-inbox
  retriever-archive:
    build: plugins/retriever-archive
  retriever-prowlarr:
    build: plugins/retriever-prowlarr
  retriever-qobuz:
    build: plugins/retriever-qobuz
  retriever-tidal:
    build: plugins/retriever-tidal
  retriever-bandcamp:
    build: plugins/retriever-bandcamp
