# Melodex joins an existing Navidrome setup; Navidrome itself isn't part of this stack. This one file is all a server
# needs: paste it into a compose dashboard (such as OpenMediaVault's), or save it beside a .env file, and start it.
#
# Settings, from the environment or a .env file beside this one:
#   MUSIC_PATH        the folder Navidrome reads (needed)
#   PUID, PGID        the user and group that own it, as `id` shows them (default 1000)
#   MELODEX_PORT      the port the web app is on (default 8787)
#   MELODEX_VERSION   the release, such as 1.0.0; latest follows each one
#   INBOX_PATH        a folder to drop music into for the inbox plugin (default ./inbox)
#   COMPOSE_PROFILES  more retrieval plugins, comma-separated: archive, prowlarr, qobuz, tidal, bandcamp
#   DOWNLOADS_PATH    qBittorrent's downloads folder, for prowlarr
#
# Open http://your-server:8787 and setup walks you through the rest, Navidrome and the plugins included.
# To build from source instead: docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# On SELinux hosts with podman, files carry the categories of the container that wrote them, and downloads pass from
# a plugin through beets to the core and Navidrome. Give every container here, and Navidrome, the same
# `security_opt: ["label=level:s0:c100,c200"]` so they can read each other's files.

x-plugin: &plugin
  user: "${PUID:-1000}:${PGID:-1000}"
  restart: unless-stopped

services:
  core:
    image: ghcr.io/joeatethebeans/melodex:${MELODEX_VERSION:-latest}
    container_name: melodex-core
    ports:
      - "${MELODEX_PORT:-8787}:8080"
    volumes:
      - config:/config
      - ${MUSIC_PATH:?Set MUSIC_PATH to the folder Navidrome reads}:/music:ro
      - staging:/staging
      - listen-now:/listen-now
    depends_on:
      - beets-worker
    # A factory reset stops Melodex for it to start afresh, so it has to come back by itself.
    restart: unless-stopped

  # The import engine, and the only thing that writes the library; the core and Navidrome only read it.
  beets-worker:
    <<: *plugin
    image: ghcr.io/joeatethebeans/melodex-beets-worker:${MELODEX_VERSION:-latest}
    container_name: melodex-beets-worker
    volumes:
      - ${MUSIC_PATH:?Set MUSIC_PATH to the folder Navidrome reads}:/music
      - staging:/staging

  # Retrieval plugins, one container each. Add each under Settings → Plugins, where they're among the templates.
  retriever-ytdlp:
    <<: *plugin
    image: ghcr.io/joeatethebeans/melodex-retriever-ytdlp:${MELODEX_VERSION:-latest}
    container_name: melodex-retriever-ytdlp
    volumes:
      - staging:/staging

  retriever-inbox:
    <<: *plugin
    image: ghcr.io/joeatethebeans/melodex-retriever-inbox:${MELODEX_VERSION:-latest}
    container_name: melodex-retriever-inbox
    volumes:
      - ${INBOX_PATH:-./inbox}:/inbox
      - staging:/staging

  # The rest only run when named in COMPOSE_PROFILES.
  retriever-archive:
    <<: *plugin
    profiles: [archive]
    image: ghcr.io/joeatethebeans/melodex-retriever-archive:${MELODEX_VERSION:-latest}
    container_name: melodex-retriever-archive
    volumes:
      - staging:/staging

  # Reads what your qBittorrent downloads, so it mounts the same folder, as qBittorrent sees it at /downloads.
  retriever-prowlarr:
    <<: *plugin
    profiles: [prowlarr]
    image: ghcr.io/joeatethebeans/melodex-retriever-prowlarr:${MELODEX_VERSION:-latest}
    container_name: melodex-retriever-prowlarr
    volumes:
      - staging:/staging
      - ${DOWNLOADS_PATH:-./downloads}:/downloads:ro

  retriever-qobuz:
    <<: *plugin
    profiles: [qobuz]
    image: ghcr.io/joeatethebeans/melodex-retriever-qobuz:${MELODEX_VERSION:-latest}
    container_name: melodex-retriever-qobuz
    volumes:
      - staging:/staging

  # Keeps its Tidal sign-in in /data.
  retriever-tidal:
    <<: *plugin
    profiles: [tidal]
    image: ghcr.io/joeatethebeans/melodex-retriever-tidal:${MELODEX_VERSION:-latest}
    container_name: melodex-retriever-tidal
    volumes:
      - staging:/staging
      - tidal:/data

  retriever-bandcamp:
    <<: *plugin
    profiles: [bandcamp]
    image: ghcr.io/joeatethebeans/melodex-retriever-bandcamp:${MELODEX_VERSION:-latest}
    container_name: melodex-retriever-bandcamp
    volumes:
      - staging:/staging

volumes:
  config:
  staging:
  listen-now:
  tidal:
